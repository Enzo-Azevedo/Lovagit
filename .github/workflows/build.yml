name: Build

# Toda atualizacao da main gera um build instalavel. `workflow_dispatch` permite
# rodar a mao sem precisar de um push.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Dois pushes seguidos na main disputariam a mesma release rolante; o run antigo
# e cancelado para nao publicar um artefato ja obsoleto por cima do novo.
concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # `test:ci` roda a suite e depois compara com o piso em
      # .github/test-floor.json. Apagar teste e a forma mais silenciosa de
      # deixar o CI verde: sem esse passo, a suite pode encolher sem reprovar.
      - name: Testes (com piso de cobertura)
        run: npm run test:ci

      # `npm run build` roda `tsc --noEmit` antes do vite: um erro de tipo
      # reprova o build em vez de virar um bundle quebrado.
      - name: Build
        run: npm run build

      # A extensao so carrega se todo caminho citado no manifest existir no
      # dist. Barato de checar aqui, caro de descobrir no "Load unpacked".
      - name: Conferir o manifest contra o dist
        run: |
          node --input-type=module -e '
            import { readFileSync, existsSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("dist/manifest.json", "utf8"));
            const referenced = [
              manifest.background.service_worker,
              manifest.side_panel.default_path,
              manifest.options_page,
              ...Object.values(manifest.icons ?? {}),
              ...Object.values(manifest.action?.default_icon ?? {}),
            ];
            const missing = referenced.filter((path) => !existsSync(`dist/${path}`));
            if (missing.length > 0) {
              console.error(`Arquivos citados no manifest e ausentes do dist: ${missing.join(", ")}`);
              process.exit(1);
            }
            console.log(`manifest v${manifest.version}: ${referenced.length} caminhos conferidos`);
          '

      - name: Empacotar
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=${GITHUB_SHA::7}
          mkdir -p out
          # O zip precisa ter o manifest na raiz — daí o `cd dist`. Os
          # sourcemaps ficam de fora: somam ~2 MB e o codigo-fonte ja esta
          # neste repositorio, publico.
          (cd dist && zip -qr "../out/lovagit-latest.zip" . -x '*.map')
          cp "out/lovagit-latest.zip" "out/lovagit-${VERSION}.zip"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Publicar artefato do run
        uses: actions/upload-artifact@v4
        with:
          name: lovagit-${{ steps.package.outputs.version }}-${{ steps.package.outputs.short_sha }}
          path: out/lovagit-latest.zip
          retention-days: 90

      # Release rolante: a tag `latest` sempre aponta para o ultimo build da
      # main, com URL de download estavel.
      #
      # A tag e' MOVIDA, nunca apagada e recriada. Apagar e recriar parecia mais
      # simples, ate o build 26 falhar com HTTP 500 no `create` depois de o
      # `delete` ja ter passado: a remocao da ref no GitHub e' assincrona, e
      # criar a release na mesma tag logo em seguida disputa com ela.
      #
      # O estrago nao era so o check vermelho. Entre apagar e criar existe uma
      # janela sem release nenhuma, e quando o `create` falha essa janela nao
      # fecha: toda extensao instalada passa a receber 404 ao procurar versao
      # nova. Movendo a tag, o pior caso vira "a release continua a anterior".
      - name: Atualizar a release `latest`
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build automatico da main.

          Commit: ${GITHUB_SHA}
          Versao do manifest: ${{ steps.package.outputs.version }}

          Instalacao: baixe o zip, extraia, e em chrome://extensions ative o Modo do
          desenvolvedor e use \"Carregar sem compactacao\" apontando para a pasta extraida."

          TITULO="Build da main (${{ steps.package.outputs.short_sha }})"

          # Tres tentativas: 500 da API do GitHub acontece, e aqui ele custaria
          # o build inteiro por algo que costuma passar na segunda.
          tentar() {
            for espera in 0 5 15; do
              [ "$espera" -gt 0 ] && sleep "$espera"
              "$@" && return 0
              echo "Falhou: $* — nova tentativa"
            done
            return 1
          }

          git tag -f latest "$GITHUB_SHA"
          tentar git push -f origin refs/tags/latest

          if gh release view latest >/dev/null 2>&1; then
            tentar gh release edit latest --title "$TITULO" --notes "$NOTES" --prerelease
            tentar gh release upload latest out/lovagit-latest.zip --clobber
          else
            tentar gh release create latest out/lovagit-latest.zip \
              --title "$TITULO" \
              --notes "$NOTES" \
              --prerelease
          fi

      # Release versionada: sai uma vez por versao, quando o package.json muda.
      # Sem isso, uma tag `v0.3.0` seria recriada a cada push e o historico de
      # versoes nao serviria para nada.
      - name: Publicar release da versao (quando o numero mudar)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} ja existe — nada a publicar."
            exit 0
          fi
          gh release create "v${VERSION}" "out/lovagit-${VERSION}.zip" \
            --title "v${VERSION}" \
            --generate-notes \
            --target "$GITHUB_SHA"
